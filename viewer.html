<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG Viewer</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .topbar {
      position: sticky;
      top: 0;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .file { font-size: 14px; color: #111827; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wrap { height: calc(100vh - 52px); }
    object, iframe, img {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .hint { font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="file" id="fileLabel">—</div>
    <div class="hint">Tip: use browser zoom (Ctrl/Cmd + / -)</div>
  </div>
  <div class="wrap">
    <object id="svgObj" type="image/svg+xml" data=""></object>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const file = params.get("file") || "";
      // allow only relative paths with safe characters
      const ok = /^[a-zA-Z0-9_./-]+\.svg$/.test(file) && !file.includes("..") && !file.startsWith("/");
      const label = document.getElementById("fileLabel");
      const obj = document.getElementById("svgObj");

      if (!ok) {
        label.textContent = "Invalid SVG path";
        obj.outerHTML = "<div style=\"padding:16px\">Invalid SVG path.</div>";
        return;
      }

      label.textContent = file;
      document.title = "SVG — " + file;
      obj.setAttribute("data", file);
    })();
  </script>
</body>
</html>
